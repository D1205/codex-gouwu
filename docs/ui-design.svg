<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" fill="none">
  <title>Mechanical Design 本机建模工作台 · 可编辑布局示意</title>
  <desc>可导入 Penpot 的矢量界面设计稿。所有模型、对话、参数和版本状态均为布局示意，不代表实际 CAD 执行或制造验收结果。左侧需求整理，中央三维预览，右侧需求及来源确认，底部实际任务与产物入口。</desc>
  <metadata>Design tokens: canvas #F4F3EF; surface #FFFFFF; ink #252C32; muted #7B8289; line #E4E5E0; accent #244F70; accent-soft #EDF3F7; pending #9A6A27; pending-soft #FBF5E9; radius 16; spacing 8,12,16,24; typography Microsoft YaHei UI / PingFang SC / sans-serif. Editable vector design only. No Penpot project has been created.</metadata>
