    <path d="M1258 116L1267 122L1258 128V116Z" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="1278" y="128" font-size="12" font-weight="600" fill="#FFFFFF">确认需求后生成</text>
  </g>
  <g id="requirements-panel" data-name="Requirements and conversation" font-family="Microsoft YaHei UI, PingFang SC, sans-serif">
    <rect x="24" y="166" width="304" height="706" rx="16" fill="#FFFFFF" stroke="#E4E5E0"/>
    <text x="44" y="197" font-size="14" font-weight="700" fill="#252C32">从你的需求开始</text>
    <rect x="249" y="183" width="59" height="22" rx="6" fill="#F4F5F2"/>
    <text x="259" y="198" font-size="10" fill="#70797D">新手模式</text>
    <text x="44" y="220" font-size="11" fill="#8B9196">像和设计师沟通一样，描述要解决的问题。</text>
    <path d="M44 239H308" stroke="#ECEDE9"/>
    <rect x="44" y="256" width="264" height="78" rx="10" fill="#F7F8F5"/>
    <text x="58" y="278" font-size="10" font-weight="600" fill="#7B8289">示例需求</text>
    <text x="58" y="300" font-size="12" fill="#3E4850">做一块 80 × 50 毫米的底板，</text>
    <text x="58" y="319" font-size="12" fill="#3E4850">四个角留螺丝孔，用来固定小模块。</text>
    <circle cx="54" cy="362" r="10" fill="#EDF3F7"/>
    <path d="M50 362H58M54 358V366" stroke="#244F70" stroke-width="1.4"/>
    <text x="72" y="367" font-size="11" font-weight="700" fill="#39586E">需求整理 · 示例</text>
    <text x="44" y="396" font-size="12" fill="#4D5961">底板外形已明确，还需要确认厚度</text>
    <text x="44" y="416" font-size="12" fill="#4D5961">和孔的位置。下面是可调整的建议。</text>
    <rect x="44" y="435" width="264" height="101" rx="10" fill="#FBFAF6" stroke="#EEE8DB"/>
    <text x="58" y="458" font-size="11" font-weight="600" fill="#7E6844">有 2 项建议等待确认</text>
    <text x="58" y="484" font-size="12" fill="#525C63">板厚</text>
    <text x="272" y="484" font-size="12" font-weight="600" text-anchor="end" fill="#3A434B">4 mm</text>
    <path d="M58 496H294" stroke="#EEE8DB"/>
    <text x="58" y="519" font-size="12" fill="#525C63">孔中心到相邻边</text>
    <text x="272" y="519" font-size="12" font-weight="600" text-anchor="end" fill="#3A434B">10 mm</text>
    <rect x="44" y="555" width="264" height="66" rx="10" fill="#EDF3F7"/>
    <text x="58" y="578" font-size="10" fill="#688396">示例局部修改</text>
    <text x="58" y="601" font-size="12" fill="#33576F">四个孔都改成 6 毫米，外形别变。</text>
    <text x="44" y="650" font-size="11" fill="#8B9196">先点选模型上的部位，也可以直接描述。</text>
    <rect x="44" y="666" width="264" height="133" rx="12" fill="#FFFFFF" stroke="#C9D5DD"/>
    <text x="58" y="693" font-size="12" fill="#A0A7AC">你想做什么，或想改哪里？</text>
    <rect x="58" y="751" width="72" height="27" rx="7" fill="#F5F6F3"/>
    <path d="M68 760L72 756L76 760V767H68V760Z" stroke="#7C868B" stroke-width="1.1"/>
    <text x="83" y="769" font-size="10" fill="#68757D">参考文件</text>
    <rect x="264" y="748" width="30" height="30" rx="8" fill="#244F70"/>
    <path d="M273 768L279 758L285 768M279 759V771" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="825" font-size="10" fill="#989FA3">缺少的信息会明确询问，建议值需要你确认。</text>
    <text x="44" y="844" font-size="10" fill="#989FA3">本画面内容为布局示意，未提交实际任务。</text>
  </g>
