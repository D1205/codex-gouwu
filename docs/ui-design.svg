  <g id="project-heading" data-name="Project heading" font-family="Microsoft YaHei UI, PingFang SC, sans-serif">
    <text x="24" y="119" font-size="24" font-weight="700" fill="#252C32">把想法，做成看得见的结构。</text>
    <text x="25" y="143" font-size="12" fill="#7B8289">描述用途，确认关键尺寸，再生成与检查模型。</text>
    <rect x="1126" y="106" width="105" height="34" rx="8" fill="#FFFFFF" stroke="#DDE1DE"/>
    <path d="M1142 116V128M1138 124L1142 128L1146 124M1137 131H1147" stroke="#626D73" stroke-width="1.3" stroke-linecap="round"/>
